map $http_upgrade $hermes_connection {
    default upgrade;
    ''      '';
}

# Only canonical instance numbers 1-99 reach this map through the location below.
map $hermes_instance $hermes_container {
    default     hermes-$hermes_instance;
    ~^[1-9]$    hermes-0$hermes_instance;
}

# Instances 1 and 3 use the gateway Webapp; other UIs remain on the dashboard.
# Both own /api too; only the separate external API mount uses 8680.
map "$hermes_instance:$hermes_external_api" $hermes_port {
    default                 9199;
    "1:"                    9120;
    "3:"                    9120;
    ~^[1-9][0-9]?:/external-api$ 8680;
}

# Compatibility for this frontend build's root-relative lazy-load helper.
# $uri is the stripped upstream path; revisit this when the bundle changes.
map "$hermes_port:$uri" $hermes_preload_helper {
    default 'rn=function(e){return`/`+e}';
    "9199:/assets/react-vendor-R7IuHd60.js" 'rn=function(e){return(window.__HERMES_BASE_PATH__||"")+`/`+e}';
}

server {
    server_name _;
    listen 80 default_server;
    listen [::]:80 default_server;

    return 301 https://$host$request_uri;
}

server {
    server_name _;
    listen 9143 ssl default_server;
    listen [::]:9143 ssl default_server;
    http2 on;

    # Podman DNS; nginx must join each provisioned instance's network.
    resolver 10.203.1.1 10.203.3.1 valid=10s ipv6=off;

    access_log /var/log/nginx/hermes-01.access.log;
    error_log /var/log/nginx/hermes-01.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    ssl_dhparam /dhparams4096.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_certificate /cert.pem;
    ssl_certificate_key /key.pem;

    ssl_early_data on;

    ssl_stapling on;
    ssl_stapling_verify on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy no-referrer;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Permissions-Policy "interest-cohort=()";

    location ^~ /.well-known {
        default_type "text/plain";
        root /usr/share/nginx/html;
        allow all;
    }

    add_header X-Robots-Tag "noindex";

    location = / {
        return 302 /hermes-1/$is_args$args;
    }

    # Preserve the full dashboard namespace; external API paths have a distinct mount.
    location ~ ^/hermes-(?<hermes_instance>[1-9][0-9]?)(?<hermes_external_api>/external-api(?=/|$))?(?<hermes_path>/.*)?$ {
        if ($hermes_path = "") {
            return 308 /hermes-$hermes_instance$hermes_external_api/$is_args$args;
        }

        # Resolve the route before rewrite changes the URI and regex captures.
        set $hermes_prefix /hermes-$hermes_instance$hermes_external_api;
        set $hermes_target $hermes_container:$hermes_port;
        rewrite ^/hermes-[1-9][0-9]?(?:/external-api)?(/.*)$ $1 break;

        # A variable upstream uses Podman DNS at request time, not startup.
        proxy_pass http://$hermes_target;
        proxy_http_version 1.1;
        client_max_body_size 50M;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix $hermes_prefix;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hermes_connection;

        # Filter uncompressed upstream JS; nginx can still gzip the response.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/javascript text/javascript;
        sub_filter_once on;
        sub_filter 'rn=function(e){return`/`+e}' $hermes_preload_helper;

        proxy_cache off;
        proxy_buffering off;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        return 404;
    }
}
